  b1_6: { bank: 2, offset: 6, role: "input", precision: "fp32", stride: 8 }
  b1_7: { bank: 2, offset: 7, role: "input", precision: "fp32", stride: 8 }

  # Matrix B Row 2 (stored on Bank 3)
  b2_0: { bank: 3, offset: 0, role: "input", precision: "fp32", stride: 8 }
  b2_1: { bank: 3, offset: 1, role: "input", precision: "fp32", stride: 8 }
  b2_2: { bank: 3, offset: 2, role: "input", precision: "fp32", stride: 8 }
  b2_3: { bank: 3, offset: 3, role: "input", precision: "fp32", stride: 8 }
  b2_4: { bank: 3, offset: 4, role: "input", precision: "fp32", stride: 8 }
  b2_5: { bank: 3, offset: 5, role: "input", precision: "fp32", stride: 8 }
  b2_6: { bank: 3, offset: 6, role: "input", precision: "fp32", stride: 8 }
