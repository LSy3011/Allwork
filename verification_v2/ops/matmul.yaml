  b0_2: { bank: 1, offset: 2, role: "input", precision: "fp32", stride: 8 }
  b0_3: { bank: 1, offset: 3, role: "input", precision: "fp32", stride: 8 }
  b0_4: { bank: 1, offset: 4, role: "input", precision: "fp32", stride: 8 }
  b0_5: { bank: 1, offset: 5, role: "input", precision: "fp32", stride: 8 }
  b0_6: { bank: 1, offset: 6, role: "input", precision: "fp32", stride: 8 }
  b0_7: { bank: 1, offset: 7, role: "input", precision: "fp32", stride: 8 }

  # Matrix B Row 1 (stored on Bank 2)
  b1_0: { bank: 2, offset: 0, role: "input", precision: "fp32", stride: 8 }
