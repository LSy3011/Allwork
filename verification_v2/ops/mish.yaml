name: "mish"
# 对应 torch.mish(x) 在 x=0.0 附近的 5 阶展开 Horner 多项式：
# y = -0.00037333334*x**5 - 0.045866667*x**4 - 0.016*x**3 + 0.32*x**2 + 0.6*x
# 采用纯一维线性 Horner 展开，100% 消除分支合并与单 Bank 1 读端口时序碰撞！
formula: "x * (0.6 + x * (0.32 + x * (-0.016 + x * (-0.045866667 - 0.00037333334 * x))))"
tensors:
  x: { bank: 0, role: "input", offset: 0 }
  constants: { bank: 7, role: "constant", offset: 0 }
  y: { bank: 2, role: "output", offset: 0 }
test_data:
  x: { range: [-1.5, 1.5] }
