unit_name: FPMUL
latency: 4
attributes:
  throughput: 1
  desc: Floating Point Multiplier
ports:
  inputs:
  - name: S0
    width: 128
  - name: S1
    width: 128
  outputs:
  - name: D
    width: 128
    type: data
    rtovr_src_id: 3       # RtoVRInputSource.DR_FPMUL_D
micro_instructions:
- field: VALID
  width: 1
  default: 0
  encoding:
    0: INVALID
    1: VALID
- field: SRC_PREC
  width: 1
  default: 1
  encoding:
    0: PREC_16
    1: PREC_32
- field: DST_PREC
  width: 1
  default: 1
  encoding:
    0: PREC_16
    1: PREC_32
behavioral_semantics:
  latching: pre_load_on_valid_or_nonzero # 支持“数据先到、指令后发”模式
  data_layouts:
    PREC_16: { element_type: FP16, count: 8, width: 16 }
    PREC_32: { element_type: FP32, count: 4, width: 32 }
  
  execution_modes:
    - name: FPMUL_CORE
      condition: "VALID == 'VALID'"
      input_source: [S0, S1]
      layout_ref: "SRC_PREC"
      operation:
        type: ARITHMETIC
        primitive: fp_mul_hw
