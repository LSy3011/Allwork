rtovr_connectivity:
  # 消费者 (Consumers / Output Side / Right Side)
  # 通过 6-bit 编号 (0-33) 在微指令中动态选通
  consumers_dr:
    0: DR_INTADD_D0
    1: DR_INTADD_D1
    2: DR_INTADD_ST
    3: DR_FPMUL_D
    4: DR_FPADD_D
    5: DR_FPADD_ST
    6: DR_FPtoFP_D
    7: DR_INTtoINT_D
    8: DR_FPtoINT_D
    9: DR_INTtoFP_D
    10: DR_LOGIC_D
    11: DR_VIN0_D
    12: DR_VIN1_D
    13: DR_VOUT0_D
    14: DR_INT8toFP16_D0
    15: DR_INT8toFP16_D1
    16: DR_INT8toFP16_D2
    17: DR_INT8toFP16_D3
    18: DR_FP16MUL_D0
    19: DR_FP16MUL_D1
    20: DR_FP16MUL_D2
    21: DR_FP16MUL_D3
    22: DR_FP16MUL_D4
    23: DR_FP16MUL_D5
    24: DR_FP16MUL_D6
    25: DR_FP16MUL_D7
    26: DR_FP32ADDTREE5TO1_D0
    27: DR_FP32ADDTREE5TO1_D1
    28: DR_FP32ADDTREE8TO1_D
    29: DR_SHIFTUP_D
    30: UR_RDATA_0
    31: UR_RDATA_1
    32: UR_RDATA_2
    33: UR_RDATA_3

  # 生产者 (Producers / Input Side / Left Side)
  # 对应 Rtovr 微指令中的 39 个固定槽位 (Slot 0-38)
  producers_dvr:
    0: DVR_INTADD_S0
    1: DVR_INTADD_S1
    2: DVR_INTADD_S2
    3: DVR_FPMUL_S0
    4: DVR_FPMUL_S1
    5: DVR_FPADD_S0
    6: DVR_FPADD_S1
    7: DVR_FPtoFP_S
    8: DVR_INTtoINT_S
    9: DVR_FPtoINT_S
    10: DVR_INTtoFP_S
    11: DVR_LOGIC_S0
    12: DVR_LOGIC_S1
    13: DVR_LOGIC_ST
    14: DVR_VIN0_S
    15: DVR_VIN1_S
    16: DVR_VOUT0_S
    17: DVR_INT8toFP16_S0
    18: DVR_INT8toFP16_S1
    19: DVR_FP16MUL_S0
    20: DVR_FP16MUL_S1
    21: DVR_FP16MUL_S2
    22: DVR_FP16MUL_S3
    23: DVR_FP16MUL_S4567
    24: DVR_FP32ADDTREE5TO1_S0
    25: DVR_FP32ADDTREE5TO1_S1
    26: DVR_FP32ADDTREE5TO1_S2
    27: DVR_FP32ADDTREE5TO1_S3
    28: DVR_FP32ADDTREE5TO1_S4
    29: DVR_FP32ADDTREE5TO1_S5
    30: DVR_FP32ADDTREE5TO1_S6
    31: DVR_FP32ADDTREE5TO1_S7
    32: DVR_FP32ADDTREE8TO1_S0
    33: DVR_FP32ADDTREE8TO1_S1
    34: DVR_SHIFTDN_S
    35: UVR_WDATA_0
    36: UVR_WDATA_1
    37: UVR_WDATA_2
    38: UVR_WDATA_3
