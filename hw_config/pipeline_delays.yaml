pipeline_delays:
  UR_READ:             1    # UR读延迟
  UR_WRITE:            1    # UR写延迟
  RTOVR:               1    # RtoVR搬运延迟
  FPADD:               4    # 浮点加法延迟
  FPMUL:               4    # 浮点乘法延迟
  INTADD:              1    # 整数加法延迟
  FP16MUL:             5    # ADR-048：trigger→DR 可读=5（乘法器核 4 + dr_fp16mul_d 输出寄存器 1 级，fp16mul.v:288/405，
                           #   VCS 双证）。refine ADR-032 D1「核 latency=4」——核 4 不变、这是 SMT 边权的「DR 可见」口径。
  FP32ADDTREE5TO1:     4    # FP32加法树5to1延迟（与 8to1 物理同构 4 级，fp32_adder_tree_final_pipeline_5to1.v）
  FP32ADDTREE8TO1:     4    # ADR-048：4 寄存器级（Stage1/2/3+输出 o_dr，8to1 pipeline .v:405/495/605/664），与 5to1 同构。
                           #   订正 ADR-031 误把 4→3（VCS 双证=4）。
  FPtoFP:              1    # 浮点转换延迟
  INTtoINT:            1    # 整数转换延迟
  FPtoINT:             1    # 浮点转整数延迟
  INTtoFP:             1    # 整数转浮点延迟
  LOGIC:               1    # 逻辑运算延迟
  SHIFTUP:             1    # 上移延迟（单 hop/单元延迟，非整链；广播链全长另计）
  SHIFTDN:             1    # 下移延迟（单 hop/单元延迟，非整链）
  # ADR-050 阶段 1（DEBT-050-VARLAT）：LDB 是变延迟 DMA（AXI 读 HBM round-trip + 写 UR，非固定流水）。
  #   阶段 1 用**保守上界 latency** 做相位隔离——ldb→b_read 边权须覆盖整条 DMA，使 b_read 排在 LDB
  #   写完 bank 之后（单端口不并发）。40 为保守值（AXI round-trip 上界），VCS 实测后再收紧。
  #   LDB_AXI 仅 ordering（→LDB），=1。升 Accepted 换 done-握手事件建模。
  LDB:                 40
  LDB_AXI:             1
  SMI_DS_T:            19   # ds_transpose→SHIFTUP 的 RAW 边权 = collect(16) + drain(3)。
                           #   collect = B×WR_BEATS = 2×8 = 16（输入 tile 填充：B=2 配对×每 unit 8 beat 串行，
                           #     smi_ds_t.v:268/305-309 + :107-110；**与 PARAM_SMC_NUM 和元素宽度(fp16/fp32)无关**，
                           #     仅随 TILE_BYTES/B）。drain = ready→data_out_vld 3 寄存器级（smi_ds_t.v:88/167/134/179）。
                           #   ADR-041 D3（hco 二轮 RTL 取证 + VCS tb_dst.vcd 全链对账 cri_vld@641+gather_fill2+
                           #     collect16+drain3=662 窗口开）。⚠ 订正旧「16=PARAM_SMC_NUM*2」——那是**输出吞吐窗口**
                           #     (OUT_ROWS×2)被误当 RAW latency，见下 SMI_DS_T_WINDOW。仍 DRAFT，升 Accepted 待 VCS 逐拍。
  SMI_DS_T_WINDOW:     16   # = OUT_ROWS×2（smi_ds_t.v:58/26，跟元素宽度走 fp32→8）。SMI_DS_T data_out_vld 持续拍数 =
                           #   SHIFTUP/UR_W0 16-beat 流广播持续拍 + RTOVR latch lifecycle + 资源占用窗口。
                           #   **不进 add_latency_axiom**（非 RAW latency）——**仅对 streaming-to-bank 边（unit_ds_transpose
                           #   逐 beat 写 bank5）成立**。ADR-041 D2。
  SMI_DS_T_DELIVER:    6    # ADR-046 D1（hco RTL 行级取证 2026-07-01）：IQ14 EXTRA_DATA **结构交付管线** =
                           #   data_out beat15 → dr_shiftup_reg 的固定拍数（PARAM_SMC_NUM 无关）。分解：
                           #   ①smi_top.v:384 wrd_vld/wrd_data→IQ14 DATAQ 写入 +1；②smi_iq_dly_queen.v:225/245/111
                           #   FSM（r_mem_rd_data→inst→cru_o 组合）+2~3；③smi_top.v:665 o_cru_shiftup_r<=iq_inst[14] +1；
                           #   ④shift_up.v:54 dr_shiftup_reg<=data_in +1。**RTL-derived 非 VCS 标定**（user 原则）。
                           #   DEBT-046-DELIVER-FSM：dly_queen FSM 2 vs 3 级的 ±1 须 VCS cycle-trace 敲死。
  SMI_DS_T_RESIDENT:   40   # ADR-046 D2（校正 ADR-043 的 35，hco 判 35 漏算整条 EXTRA_DATA 交付管线非"漏 1 寄存器"）：
                           #   = SMI_DS_T(19 首 beat) + (SMI_DS_T_WINDOW−1=15 到末 beat) + SMI_DS_T_DELIVER(6) = 40。
                           #   **职责降级（ADR-046）**：RESIDENT 只保 **SMT 逻辑排序 + verifier 一致**（dependency_axioms
                           #   + ucode_solver 维度4/6 必同取，否则 ADR-006/021 类 desync），**不再承担 VCS 拍对齐**——
                           #   VCS 拍由 assembler emit abs_t 锚定（compute 垫 derived lead-NOP）承担（ADR-046 D3）。
                           #   仅对采驻留末 beat 的 compute-side 边（consumer 带 dst_compute_resident）；unit streaming-to-bank
                           #   仍 19。compute 采的是唯一 held 末 beat（shift_up.v:52-58 每拍覆盖、只末拍保持、单 token held 无界）。
  INT8toFP16:          1    # INT8转FP16延迟
  VIN0:                0    # 向量输入流水线寄存器0
  VIN1:                0    # 向量输入流水线寄存器1
  VOUT0:               0    # 向量输出流水线寄存器0
