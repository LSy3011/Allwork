pipeline_delays:
  UR_READ:             1    # UR读延迟
  UR_WRITE:            1    # UR写延迟
  RTOVR:               1    # RtoVR搬运延迟
  FPADD:               4    # 浮点加法延迟
  FPMUL:               4    # 浮点乘法延迟
  INTADD:              1    # 整数加法延迟
  FP16MUL:             4    # FP16乘法延迟（ADR-032：user 2026-06-04 裁定单元 latency=4，原 2 错）
  FP32ADDTREE5TO1:     4    # FP32加法树5to1延迟
  FP32ADDTREE8TO1:     3    # FP32加法树8to1延迟
  FPtoFP:              1    # 浮点转换延迟
  INTtoINT:            1    # 整数转换延迟
  FPtoINT:             1    # 浮点转整数延迟
  INTtoFP:             1    # 整数转浮点延迟
  LOGIC:               1    # 逻辑运算延迟
  SHIFTUP:             1    # 上移延迟（单 hop/单元延迟，非整链；广播链全长另计）
  SHIFTDN:             1    # 下移延迟（单 hop/单元延迟，非整链）
  SMI_DS_T:            19   # ds_transpose→SHIFTUP 的 RAW 边权 = collect(16) + drain(3)。
                           #   collect = B×WR_BEATS = 2×8 = 16（输入 tile 填充：B=2 配对×每 unit 8 beat 串行，
                           #     smi_ds_t.v:268/305-309 + :107-110；**与 PARAM_SMC_NUM 和元素宽度(fp16/fp32)无关**，
                           #     仅随 TILE_BYTES/B）。drain = ready→data_out_vld 3 寄存器级（smi_ds_t.v:88/167/134/179）。
                           #   ADR-041 D3（hco 二轮 RTL 取证 + VCS tb_dst.vcd 全链对账 cri_vld@641+gather_fill2+
                           #     collect16+drain3=662 窗口开）。⚠ 订正旧「16=PARAM_SMC_NUM*2」——那是**输出吞吐窗口**
                           #     (OUT_ROWS×2)被误当 RAW latency，见下 SMI_DS_T_WINDOW。仍 DRAFT，升 Accepted 待 VCS 逐拍。
  SMI_DS_T_WINDOW:     16   # = OUT_ROWS×2（smi_ds_t.v:58/26，跟元素宽度走 fp32→8）。SMI_DS_T data_out_vld 持续拍数 =
                           #   SHIFTUP/UR_W0 16-beat 流广播持续拍 + RTOVR latch lifecycle + 资源占用窗口。
                           #   **不进 add_latency_axiom**（非 RAW latency）——**仅对 streaming-to-bank 边（unit_ds_transpose
                           #   逐 beat 写 bank5）成立**。ADR-041 D2。
  SMI_DS_T_RESIDENT:   35   # ADR-043 D4：**resident-sampling 边**（compute 采 SMI_DS_T 广播的 held 末 beat）的 RAW latency
                           #   = SMI_DS_T(19 首 beat) + SMI_DS_T_WINDOW(16) = 35。partial-supersede ADR-041 D2「WINDOW 不进
                           #   RAW latency」——仅对**采驻留末 beat 的 compute-side 边**（q_dst 等，consumer 带 dst_compute_resident）。
                           #   streaming-to-bank 边（unit）仍用 19。35 = (WINDOW−1)+shiftup reg(+1) 相消（shift_up.v:54 /
                           #   smi_ds_t.v:58 LAST_BEAT=15），非「+整窗」；VCS 校 ±1~2（DEBT-043-RESIDENT-LAT-VCS）。
                           #   compute 采的是唯一 held 到下次广播的末 beat（shift_up.v:52-58 每拍覆盖、只末拍保持）。
  INT8toFP16:          1    # INT8转FP16延迟
  VIN0:                0    # 向量输入流水线寄存器0
  VIN1:                0    # 向量输入流水线寄存器1
  VOUT0:               0    # 向量输出流水线寄存器0
