name: "sqrt"
# 对应 torch.sqrt(x) 在 x=1.0 附近的 4 阶展开 Horner 多项式：
# y = -0.0390625*x**4 + 0.21875*x**3 - 0.546875*x**2 + 1.09375*x + 0.2734375
# 采用纯一维线性 Horner 展开，100% 消除分支合并与单 Bank 1 读端口时序碰撞！
formula: "0.2734375 + x * (1.09375 + x * (-0.546875 + x * (0.21875 - 0.0390625 * x)))"
tensors:
  x: { bank: 0, role: "input", offset: 0 }
  constants: { bank: 7, role: "constant", offset: 0 }
  y: { bank: 2, role: "output", offset: 0 }
test_data:
  x: { range: [0.6, 1.4] }
