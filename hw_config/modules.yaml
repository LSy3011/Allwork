modules:
  FPADD:
    type: compute
    latency: 4
    inputs: [DVR-FPADD-S0, DVR-FPADD-S1]
    outputs: [DR-FPADD-D, DR-FPADD-ST]
    code_bits: 10
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_prec, bits: 1}
      - {name: dst_prec, bits: 1}
      - {name: up_stat_en, bits: 1}
      - {name: add_or_sub, bits: 1}
      - {name: smc_id_en, bits: 5}
    parallelism:
      prec_16bit:
        lanes: 8
        formula: "DR_D[x], DR_ST[x] = S0[x] +/- S1[x] (x=0..7)"
      prec_32bit:
        lanes: 4
        formula: "DR_D[x], DR_ST[x] = S0[x] +/- S1[x] (x=0..3)"

  FPMUL:
    type: compute
    latency: 4
    inputs: [DVR-FPMUL-S0, DVR-FPMUL-S1]
    outputs: [DR-FPMUL-D]
    code_bits: 8
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_prec, bits: 1}
      - {name: dst_prec, bits: 1}
      - {name: smc_id_en, bits: 5}
    # 核心拆分对齐逻辑
    parallelism:
      prec_16bit:
        lanes: 8
        formula: "DR_D[x] = S0[x] * S1[x] (x=0..7)"
      prec_32bit:
        lanes: 4
        formula: "DR_D[x] = S0[x] * S1[x] (x=0..3)"

  RTOVR:
    type: router
    latency: 1
    code_bits: 7
    code_fields:
      - {name: vld, bits: 1}
      - {name: dr_index, bits: 6} # 对应端子编号 0~33

  UR_READ:
    type: memory_access
    latency: 1
    code_bits: 17
    code_fields:
      - {name: re, bits: 1}
      - {name: rbank, bits: 3}
      - {name: raddr, bits: 8}
      - {name: smc_id_en, bits: 5}

  UR_WRITE:
    type: memory_access
    latency: 1
    code_bits: 33
    code_fields:
      - {name: we, bits: 1}
      - {name: wbank, bits: 3}
      - {name: waddr, bits: 8}
      - {name: wbe, bits: 16}
      - {name: smc_id_en, bits: 5}

  STB:
    type: transfer
    latency: 1
    code_bits: 7
    code_fields:
      - {name: vld, bits: 1}
      - {name: slot_id, bits: 6}

  INTADD:
    type: compute
    latency: 1
    code_bits: 18
    code_fields:
      - {name: vld, bits: 1}
      - {name: src0_prec, bits: 2}
      - {name: src1_prec, bits: 2}
      - {name: src2_prec, bits: 2}
      - {name: src0_sign, bits: 1}
      - {name: src1_sign, bits: 1}
      - {name: src2_sign, bits: 1}
      - {name: dst_sign, bits: 1}
      - {name: update_st, bits: 1}
      - {name: add_sub, bits: 1}
      - {name: smc_id_en, bits: 5}
