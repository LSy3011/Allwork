unit_name: SHIFTDN
latency: 1
code_bits: 129  # vld(1) + data(128) — 严格按硬件 spec 表 547
attributes:
  throughput: 1
  desc: Cross-SMC chain shift (downward), no broadcast field (OQ-5 + spec 表 547)
  cross_smc_chain: true
  cross_smc_data_source: dynamic
  chain_direction: descending
ports:
  inputs:
    - name: CRD_SHIFTDN_I   # 硬件 spec 表 545：CRD 不是 CRU（下行寄存器）
      width: 129            # 寄存器宽度 = 整个 microinstruction
      cross_smc_src: true
    - name: DVR_SHIFTDN_S
      width: 128
    - name: SMC_ID
      width: 5
      desc: "本模块所在 SMC 的 ID 编码（硬件接口，emitter 无需注入）"
  outputs:
    - name: CRD_SHIFTDN_O
      width: 129
      cross_smc_dst: true
micro_instructions:
  # 严格按硬件 spec 表 547，仅 2 个字段。
  # 注意 spec gap：SHIFTDN 功能公式用 smc_id_en，但 spec 表 545（接口）+ 表 547（微指令）均未列。
  # sim 层暂 fallback 到 PARAM_SMC_NUM-1 = 31（注：ADR-019 errata task #19 known gap，
  # 待硬件 spec 进一步澄清）。
  - field: VALID
    width: 1
    default: 0
    encoding:
      0: INVALID
      1: VALID
  - field: data
    width: 128
    default: 0
    desc: "起点 SMC 通过 DVR_SHIFTDN_S 输入；该 microinstruction data 字段为读出数据"
behavioral_semantics:
  start_point: "SMC_ID == smc_id_en: CRD_SHIFTDN_O <- DVR_SHIFTDN_S"
  chain_propagation: "SMC_ID < smc_id_en: CRD_SHIFTDN_O <- CRD_SHIFTDN_I"
  chain_stage_latency: 1
  smc_id_en_source: "spec gap — 功能公式用但 spec 表均未列；sim fallback PARAM_SMC_NUM-1"
  iq_slot_consumption: "SMC_ID <= smc_id_en 沿途每 SMC 在 t=t0（同步发射，OQ-8 (i)）各消耗自己的 SHIFTDN IQ slot"
