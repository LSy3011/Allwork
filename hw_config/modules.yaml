modules:
  FPADD:
    type: compute
    latency: 4
    inputs: [DVR-FPADD-S0, DVR-FPADD-S1]
    outputs: [DR-FPADD-D, DR-FPADD-ST]
    code_bits: 10
    code_fields:
      - {name: VALID, bits: 1}
      - {name: SRC_PREC, bits: 1}
      - {name: DST_PREC, bits: 1}
      - {name: UPDATE_ST, bits: 1}
      - {name: SUB, bits: 1}
      - {name: smc_id_en, bits: 5}   # ADR-031：SMC_ID 是 smc_id_en 异名，统一命名（除 RTOVR 全单元一致）
    parallelism:
      prec_16bit:
        lanes: 8
        formula: "DR_D[x], DR_ST[x] = S0[x] +/- S1[x] (x=0..7)"
      prec_32bit:
        lanes: 4
        formula: "DR_D[x], DR_ST[x] = S0[x] +/- S1[x] (x=0..3)"

  FPMUL:
    type: compute
    latency: 4
    inputs: [DVR-FPMUL-S0, DVR-FPMUL-S1]
    outputs: [DR-FPMUL-D]
    code_bits: 8
    code_fields:
      - {name: VALID, bits: 1}
      - {name: SRC_PREC, bits: 1}
      - {name: DST_PREC, bits: 1}
      - {name: smc_id_en, bits: 5}   # ADR-031：SMC_ID 是 smc_id_en 异名，统一命名（除 RTOVR 全单元一致）
    # 核心拆分对齐逻辑
    parallelism:
      prec_16bit:
        lanes: 8
        formula: "DR_D[x] = S0[x] * S1[x] (x=0..7)"
      prec_32bit:
        lanes: 4
        formula: "DR_D[x] = S0[x] * S1[x] (x=0..3)"

  # ADR-032：FP16 推理 matmul 乘法器（v0.4.19 表512-514）。3 微指令 compute/load_s0123/load_s4567。
  # compute 读 DR_FP16MUL_S* 寄存器堆（非 DVR）→ 必须 emit load 微指令（hco option b）。
  # 顶层 code_bits/code_fields 镜像 compute 组（向后兼容）；micro_groups 载全 3 组。
  FP16MUL:
    type: compute
    latency: 5    # ADR-048：核 4 + dr 输出寄存器 1 = 5（fp16mul.v:288/405）。锁步 pipeline_delays + specs/units。
    # 端口名须与 rtovr_config producers_dvr 的 FP16MUL_S* 一致（ucode_solver 按 inputs
    # 位置序 positional 查 dvr_map 解 RTOVR 选通槽：deps[i] → inputs[i]）。
    # 顺序为 [S0, S4567, S1, S2, S3]：**加法式扩展**——S1(单对)用前 2 位 S0/S4567 不变；
    # S2(满 32 乘 4 列)按 deps=[w0, act, w1, w2, w3] 对齐 S0/S4567/S1/S2/S3（ADR-032 S2
    # 角色互换：4 权重列→S0-S3、广播激活→S4567）。S4567 置第 2 位是为保 S1 deps[1]→S4567。
    inputs: [DVR-FP16MUL-S0, DVR-FP16MUL-S4567, DVR-FP16MUL-S1, DVR-FP16MUL-S2, DVR-FP16MUL-S3]
    outputs: [DR-FP16MUL-D0, DR-FP16MUL-D1, DR-FP16MUL-D2, DR-FP16MUL-D3, DR-FP16MUL-D4, DR-FP16MUL-D5, DR-FP16MUL-D6, DR-FP16MUL-D7]
    code_bits: 8
    code_fields:
      - {name: VALID, bits: 1}
      - {name: src_0_id, bits: 1}
      - {name: src_1_id, bits: 1}
      - {name: smc_id_en, bits: 5}
    micro_groups:
      compute:        # 表512 CRU_FP16MUL：触发 32 FP16 乘
        code_bits: 8
        code_fields:
          - {name: VALID, bits: 1}
          - {name: src_0_id, bits: 1}
          - {name: src_1_id, bits: 1}
          - {name: smc_id_en, bits: 5}
      load_s0123:     # 表513 CRU_FP16MUL_S0123：load 广播源 S0-S3 进 DR 寄存器堆
        code_bits: 7
        latency: 1    # ADR-049：latch 1 拍（write_enable→s*_bank_r posedge，fp16mul.v:98/108-220），非乘法 5 拍
        code_fields:
          - {name: VALID, bits: 1}
          - {name: src3210_high_id, bits: 1}
          - {name: smc_id_en, bits: 5}
      load_s4567:     # 表514 CRU_FP16MUL_S4567：load 本地源 S4-S7（low_id 选 4/5/6/7）
        code_bits: 9
        latency: 1    # ADR-049：latch 1 拍（write_enable→s*_bank_r posedge，fp16mul.v:106/108-220），非乘法 5 拍
        code_fields:
          - {name: VALID, bits: 1}
          - {name: src7654_high_id, bits: 1}
          - {name: src7654_low_id, bits: 2}
          - {name: smc_id_en, bits: 5}
    parallelism:
      fp16:
        lanes: 32
        formula: "D{0..7}[x] = S{0..3}[x|x+4] * S{4..7}[x|x+4]（4 对 × 8 lane = 32 FP16 乘，FP32 出）"

  LOGIC:
    type: compute
    latency: 1
    inputs: [DVR-LOGIC-S0, DVR-LOGIC-S1, DVR-LOGIC-ST]
    outputs: [DR-LOGIC-D]
    code_bits: 11
    code_fields:
      - {name: VALID, bits: 1, default: 1}
      - name: OP_TYPE
        bits: 4
        default: 0
        encoding:
          AND: 0
          OR: 1
          XOR: 2
          NOT: 3
          COPY: 4
          SELECT_GT: 5
          SELECT_EQ: 6
          SELECT_LS: 7
          SELECT_GE: 8
          SELECT_LE: 9
          SELECT_NE: 10
      - {name: PRECISION, bits: 1, default: 1}
      - {name: smc_id_en, bits: 5, default: 0}   # ADR-031 / v0.4.19 表 541：LOGIC smc_id_en 5bit（原 4bit 错，字段和 10→11=code_bits）

  RTOVR:
    type: router
    latency: 1
    inputs: [DVR-RTOVR-SEL]
    code_bits: 7
    code_fields:
      - {name: VALID, bits: 1}
      - {name: SEL, bits: 6}

  # ADR-053：VIN0/VIN1/VOUT0 绕行寄存器单元（RtoVR 稀疏掩码下 UR↔计算 的唯一合法路径）。
  #   物理：IPR/OPR（u280_sim_v422/smc/common/{IPR,OPR}.sv:87 "One cycle delay"），
  #   IQ68/69/70（smi/smi_top.v:788-790）。
  #   ⚠ 帧宽错误链（2026-09-12 VCS 取证，ADR-053 errata）：CRU_VIN_W=6（smi_iq_cru_widths.vh:30-31）
  #     只是**数据通路**提取的 {smc_id_en[4:0],vld}6bit（smi_top.v:788 iq_inst[68][CRU_VIN_W-1:0]）；
  #     而 IQ 帧宽 = 41 header + 7 CODE——同文件 :16「IQ68..70 use CODE[5:0] for VIN..CODE[6] is reserved」
  #     即 CODE 有第 7 个保留位，header 必须落在 bit[47:7]、VLD 在 bit47。
  #     曾按 code_bits=6 建模 → header 落在 [46:6] → RTL 读 bit47=0 → 全部 VIN 行 header vld=0，
  #     VCS 实测 bank2 全零（golden 流在同样数据上通过；golden C++ MUL_SCALAR_VIN_VOUT_CODE_BITS=7 一致）。
  #     故 code_bits=7，code_fields 显式登记 RESERVED(body[6]) 使字段和=7（test_codebits_consistency 不红，
  #     master/specs 侧同步登记 → 模拟器 decoder payload=7、header 同样落 [47:7]——三向同源）。
  #   位布局 {smc_id_en[5:1], vld[0]}；per-SMC 门控 vld_eff = vld && (smc_id_en >= SMC_ID)（IPR.sv:74-76）。
  #   端口映射：VIN0_S=RtoVR out14→VIN0_D=sel11；VIN1_S=out15→VIN1_D=sel12；VOUT0_S=out16→VOUT0_D=sel13。
  #   smc_id_en 由 D4 绕行 pass 显式写 metadata=31（照 golden；不经 payload_factory 缺省分支，ADR-053 D5/B3）。
  VIN0:
    type: reg_pipe        # ADR-053 D2 新增类型（hco 裁决批准）：vld 门控 1 拍流水寄存器
    latency: 1
    inputs: [DVR-VIN0-S]
    outputs: [DR-VIN0-D]
    code_bits: 7  # 帧宽 41+7（body[6] 保留恒 0，CRU 取 body[5:0]）；曾按 6 建模致 header 左偏 1 位全行 vld=0（上方注释）
    code_fields:
      - {name: VALID, bits: 1}          # body[0]
      - {name: smc_id_en, bits: 5}      # body[5:1]
      - {name: RESERVED, bits: 1}       # body[6] CODE[6] 保留位（vh:16）；packer 未给值时补 0（packer.py:68）
  VIN1:
    type: reg_pipe
    latency: 1
    inputs: [DVR-VIN1-S]
    outputs: [DR-VIN1-D]
    code_bits: 7  # 同 VIN0（帧宽 41+7，body[6] 保留恒 0）
    code_fields:
      - {name: VALID, bits: 1}
      - {name: smc_id_en, bits: 5}
      - {name: RESERVED, bits: 1}   # body[6] 保留位（同 VIN0）
  VOUT0:
    type: reg_pipe
    latency: 1
    inputs: [DVR-VOUT0-S]
    outputs: [DR-VOUT0-D]
    code_bits: 7  # 同 VIN0（帧宽 41+7，body[6] 保留恒 0）
    code_fields:
      - {name: VALID, bits: 1}
      - {name: smc_id_en, bits: 5}
      - {name: RESERVED, bits: 1}   # body[6] 保留位（同 VIN0）

  UR_READ:
    type: memory_access
    latency: 1
    code_bits: 17
    code_fields:
      - {name: VALID, bits: 1}
      - {name: BANK, bits: 3}
      - {name: ADDR, bits: 8}
      - {name: smc_id_en, bits: 5}   # ADR-031：SMC_ID 是 smc_id_en 异名，统一命名（除 RTOVR 全单元一致）

  UR_WRITE:
    type: memory_access
    latency: 1
    inputs: [DVR-UR_WRITE-D]
    code_bits: 33
    code_fields:
      - {name: VALID, bits: 1}
      - {name: BANK, bits: 3}
      - {name: ADDR, bits: 8}
      - {name: wbe, bits: 16}
      - {name: smc_id_en, bits: 5}   # ADR-031：SMC_ID 是 smc_id_en 异名，统一命名（除 RTOVR 全单元一致）

  # ADR-052：STB Store-Buffer（UR → AXI → 外部 HBM，LDB 的反向）。两条 CRU 微指令流：
  #   STB（iq_inst[24], 50b, UR 读侧）+ STB_AXI（iq_inst[25], 102b, AXI 写侧）。
  #   字段逐位对齐 RTL stb_ur_axi_conv.v:252-315 的**行级位选**（reg [49:0] / reg [101:0]）
  #   + 打包实现 iq/modules/stb_iq.cpp:26-56（hco 行级独立取证，2026-09-10）。emit iq_stb.hex + iq_stb-axi.hex。
  #   与 LDB 镜像：STB = LDB − {const(6b), pre_fill(1b), post_fill(1b)} + {tid(2b)}，后段**整体下移 8 位**
  #   （是 8 不是 6：删的是 8 bit；inst_id LDB[50:47]→STB[42:39]、smc_id_en LDB[55:51]→STB[47:43]）。
  #   变延迟 DMA + done 握手（与 LDB 同族，共享 DEBT-050-VARLAT）→ 阶段 1 latency 取保守上界 + 相位隔离。
  STB:
    type: transfer
    latency: 1        # 占位：STB 变延迟，阶段 1 靠 DFG 相位隔离 + pipeline_delays 的 STB:40（见 D6）
    code_bits: 50
    code_fields:
      - {name: VALID, bits: 1}            # [0]
      - {name: ur_addr, bits: 15}         # [15:1]  字节地址：bank=[14:12]/depth=[11:4]/byteoff=[3:0]
      - {name: ur_rd_line_cnt, bits: 8}   # [23:16] 读 UR 行数（LDB 是 ur_wr_*，仅语义与字段名不同）
      - {name: line_byte_cnt, bits: 9}    # [32:24] 每行字节数
      - {name: line_stride, bits: 6}      # [38:33] UR 行步长（字节步 = <<4）
      - {name: inst_id, bits: 4}          # [42:39] 完成握手匹配
      - {name: smc_id_en, bits: 5}        # [47:43]
      - {name: tid, bits: 2}              # [49:48] AXI 事务 ID → axism_m_tid（stb_ur_axi_conv.v:292→:689）

  STB_AXI:
    type: transfer
    latency: 1
    code_bits: 102
    code_fields:
      - {name: VALID, bits: 1}            # [0]
      - {name: first_byte_strb, bits: 4}  # [4:1]
      - {name: last_byte_strb, bits: 4}   # [8:5]
      - {name: brst, bits: 4}             # [12:9]  AXI burst len → awlen；≤15=16 拍（256B/16 行）
      - {name: gr_base_addr, bits: 40}    # [52:13] HBM 字节基址
      - {name: gr_intlv_addr, bits: 40}   # [92:53] per-SMC 交织步长（awaddr = gr_base + smc_id × gr_intlv）
      - {name: inst_id, bits: 4}          # [96:93]
      - {name: smc_id_en, bits: 5}        # [101:97]
      # ⚠ 无 tid：STB_AXI = LDB_AXI − {tid(2b)}（LDB_AXI 的 tid 在 [103:102]，本流不带）

  # ADR-050：LDB Load-Buffer（外部 HBM 经 AXI → UR）。两条 CRU 微指令流（同 fp16mul s0123/s4567 分桶范式）：
  #   LDB（iq_inst[26], 56b, UR 写侧）+ LDB_AXI（iq_inst[27], 104b, AXI 读侧）。字段逐位对齐 RTL
  #   ldb_ur_axi_conv.v:271-303 + smi_iq_cru_widths.vh:104-113（hco 行级取证）。emit iq_ldb.hex + iq_ldb-axi.hex。
  #   变延迟 DMA+done 握手（非固定流水）→ 阶段 1 latency 取保守上界 + 相位隔离（DEBT-050-VARLAT）。
  LDB:
    type: transfer
    latency: 1        # 占位：LDB 变延迟，阶段 1 靠 DFG 相位隔离（LDB done 后 compute 读 bank），非此常数
    code_bits: 56
    code_fields:
      - {name: VALID, bits: 1}            # [0]
      - {name: ur_addr, bits: 15}         # [15:1]  字节地址：bank=[14:12]/depth=[11:4]/byteoff=[3:0]
      - {name: ur_wr_line_cnt, bits: 8}   # [23:16] 写 UR 行数
      - {name: line_byte_cnt, bits: 9}    # [32:24] 每行字节数
      - {name: line_stride, bits: 6}      # [38:33] UR 行步长（字节步=<<4）
      - {name: const, bits: 6}            # [44:39] 填充常量选择
      - {name: pre_fill, bits: 1}         # [45]
      - {name: post_fill, bits: 1}        # [46]
      - {name: inst_id, bits: 4}          # [50:47] 完成握手匹配
      - {name: smc_id_en, bits: 5}        # [55:51]

  LDB_AXI:
    type: transfer
    latency: 1
    code_bits: 104
    code_fields:
      - {name: VALID, bits: 1}            # [0]
      - {name: first_byte_strb, bits: 4}  # [4:1]
      - {name: last_byte_strb, bits: 4}   # [8:5]
      - {name: brst, bits: 4}             # [12:9]  AXI burst len → arlen
      - {name: gr_base_addr, bits: 40}    # [52:13] HBM 字节基址
      - {name: gr_intlv_addr, bits: 40}   # [92:53] per-SMC 交织步长（araddr=gr_base+smc_id×gr_intlv）
      - {name: inst_id, bits: 4}          # [96:93]
      - {name: smc_id_en, bits: 5}        # [101:97]
      - {name: tid, bits: 2}              # [103:102]

  INTADD:
    type: compute
    latency: 1
    code_bits: 18
    code_fields:
      - {name: vld, bits: 1}
      - {name: src0_prec, bits: 2}
      - {name: src1_prec, bits: 2}
      - {name: src2_prec, bits: 2}
      - {name: src0_sign, bits: 1}
      - {name: src1_sign, bits: 1}
      - {name: src2_sign, bits: 1}
      - {name: dst_sign, bits: 1}
      - {name: update_st, bits: 1}
      - {name: add_sub, bits: 1}
      - {name: smc_id_en, bits: 5}

  FPTOINT:
    type: compute
    latency: 1
    code_bits: 10
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_prec, bits: 1}
      - {name: dst_prec, bits: 1}
      - {name: src_pos, bits: 1}
      - {name: dst_pos, bits: 1}
      - {name: smc_id_en, bits: 5}

  INTTOFP:
    type: compute
    latency: 1
    code_bits: 11   # ADR-031 / v0.4.19 表 538：vld+src_prec+dst_prec+src_sign+src_pos+dst_pos+smc_id_en
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_prec, bits: 1}
      - {name: dst_prec, bits: 1}
      - {name: src_sign, bits: 1}   # ADR-031：表 538 有此字段，原 modules.yaml 漏
      - {name: src_pos, bits: 1}
      - {name: dst_pos, bits: 1}
      - {name: smc_id_en, bits: 5}

  INTTOINT:
    type: compute
    latency: 1
    code_bits: 12
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_prec, bits: 1}
      - {name: dst_prec, bits: 1}
      - {name: src_sign, bits: 1}
      - {name: dst_sign, bits: 1}
      - {name: src_pos, bits: 1}
      - {name: dst_pos, bits: 1}
      - {name: smc_id_en, bits: 5}

  FPTOFP:
    type: compute
    latency: 1
    code_bits: 10
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_prec, bits: 1}
      - {name: dst_prec, bits: 1}
      - {name: src_pos, bits: 1}
      - {name: dst_pos, bits: 1}
      - {name: smc_id_en, bits: 5}

  INT8toFP16:
    type: compute
    latency: 2
    code_bits: 7
    code_fields:
      - {name: vld, bits: 1}
      - {name: src_sign, bits: 1}
      - {name: smc_id_en, bits: 5}

  FP32ADDTREE5TO1:
    type: compute
    latency: 4
    # RTL 表 517（user 2026-06-02）：vld(1)+accumulate(1)+smc_id_en(5)=7 bit。
    # accumulate: 'b1 累加（old_i 参与）/ 'b0 不累加。原 yaml 漏此位（=6）→ body 少 1 bit
    # 令 emitter 与真 RTL 错位（VCS 解码整条 header 左移、假 JUMP）+ cumulative 未编码进固件。
    # 见 ADR-029。字段顺序严格按表 517：vld(bit0) → accumulate(bit1) → smc_id_en(bit2-6)。
    code_bits: 7
    code_fields:
      - {name: VALID, bits: 1}
      - {name: accumulate, bits: 1}
      - {name: smc_id_en, bits: 5}

  FP32ADDTREE8TO1:
    type: compute
    latency: 4    # ADR-048：4 寄存器级、与 5to1 同构（订正 ADR-031 误 4→3）。锁步 pipeline_delays + specs/units。
    code_bits: 8
    code_fields:
      - {name: VALID, bits: 1}
      - {name: DST_REG, bits: 2}
      - {name: smc_id_en, bits: 5}

  SHIFTUP:
    type: cross_smc_chain
    latency: 1
    inputs: [CRU_SHIFTUP_I, SMC_ID]
    outputs: [CRU_SHIFTUP_O, DR_SHIFTUP_D]
    code_bits: 135  # 严格按硬件 spec 表 544（vld+data+broadcast+smc_id_en）
    code_fields:
      - {name: VALID, bits: 1}
      - {name: data, bits: 128}
      - {name: broadcast, bits: 1}
      - {name: smc_id_en, bits: 5}

  SHIFTDN:
    type: cross_smc_chain
    latency: 1
    inputs: [CRD_SHIFTDN_I, DVR_SHIFTDN_S, SMC_ID]  # 硬件 spec 表 545：CRD（下行）不是 CRU
    outputs: [CRD_SHIFTDN_O]
    code_bits: 7  # ADR-031 / v0.4.19 表 547：vld(1)+broadcast(1)+smc_id_en(5)；data 走源寄存器 DVR_SHIFTDN_S 非立即数
    code_fields:
      - {name: VALID, bits: 1}
      - {name: broadcast, bits: 1}
      - {name: smc_id_en, bits: 5}

  # ADR-034 D1：SMI_DS_T（Data Shuffle_Transpose）跨-SMC 转置中心模块（v0.4.19 表596-598）。
  # **指令驱动硬件单元**（ADR-034 升级，去 ADR-033 Stage-A 的 simulation_only）：CRI 指令 + 表598 微指令
  # + INST_DONE，和 UR/FPMUL 同构。由 IQ_SMI_DS_T 驱动（base id 40，system_core.yaml）。
  # 与 DS（表585-588，每-SMC、挂 STB↔LDB、单 SMC 内 UR→UR）是两个不同模块（分歧台账 D-01）。
  # CRI 指令逐字段位宽未定（表596 CRI 宽度=*）→ NEEDS-USER-FACT-034-CRI，code_fields 仅列表598 已知字段。
  SMI_DS_T:
    type: cross_smc_transpose
    latency: 1
    inputs: [CRD_SHIFTDN, CRI]       # 表596：输入数据来自 SHIFTDN gather（129b）+ CRI 指令
    outputs: [DATA_OUT]              # 表596：输出 → SHIFTUP scatter（128b）
    code_bits: 5  # 表598：vld+intlv_en+intlv_grp+intlv_in+intlv_out 各 1bit
    code_fields:
      - {name: VALID, bits: 1}
      - {name: intlv_en, bits: 1}
