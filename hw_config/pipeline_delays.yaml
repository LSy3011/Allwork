pipeline_delays:
  UR_READ:             1    # UR读延迟
  UR_WRITE:            1    # UR写延迟
  RTOVR:               1    # RtoVR搬运延迟
  FPADD:               4    # 浮点加法延迟
  FPMUL:               4    # 浮点乘法延迟
  INTADD:              1    # 整数加法延迟
  FP16MUL:             4    # FP16乘法延迟（ADR-032：user 2026-06-04 裁定单元 latency=4，原 2 错）
  FP32ADDTREE5TO1:     4    # FP32加法树5to1延迟
  FP32ADDTREE8TO1:     3    # FP32加法树8to1延迟
  FPtoFP:              1    # 浮点转换延迟
  INTtoINT:            1    # 整数转换延迟
  FPtoINT:             1    # 浮点转整数延迟
  INTtoFP:             1    # 整数转浮点延迟
  LOGIC:               1    # 逻辑运算延迟
  SHIFTUP:             1    # 上移延迟（单 hop/单元延迟，非整链；广播链全长另计）
  SHIFTDN:             1    # 下移延迟（单 hop/单元延迟，非整链）
  SMI_DS_T:            16   # 激活矩阵排序(流式转置)级固定 latency = PARAM_SMC_NUM*2（para1194/1237
                           #   一次广播读延迟，含一半气泡 B=2 填）。ADR-036 Q2 模型：转置 latency=gather
                           #   完成点（para1039「前两指令完成读取后立即输出」→转置级近 0 额外延迟、主延迟在
                           #   gather）。PARAM_SMC_NUM=8 实例→16。仍 proposed，升 Accepted 待 VCS 逐拍校准。
  INT8toFP16:          1    # INT8转FP16延迟
  VIN0:                0    # 向量输入流水线寄存器0
  VIN1:                0    # 向量输入流水线寄存器1
  VOUT0:               0    # 向量输出流水线寄存器0
