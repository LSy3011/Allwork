name: "hardsigmoid"
# hardsigmoid: 0.0 if x < -2.5 else (1.0 if x > 2.5 else 0.2*x + 0.5)
formula: "Piecewise((0.0, x < -2.5), (1.0, x > 2.5), (0.2 * x + 0.5, True))"
tensors:
  x: { bank: 0, role: "input", offset: 0 }
  constants: { bank: 7, role: "constant", offset: 0 }
  y: { bank: 2, role: "output", offset: 0 }
test_data:
  x: { range: [-5.0, 5.0] }
