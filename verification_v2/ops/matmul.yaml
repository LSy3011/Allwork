  # Matrix B Row 3 (stored on Bank 4)
  b3_0: { bank: 4, offset: 0, role: "input", precision: "fp32", stride: 8 }
  b3_1: { bank: 4, offset: 1, role: "input", precision: "fp32", stride: 8 }
