name: "scale_sum"
# ADR-056 §E 候选新公式（步⑤ V1 验收对象）：y = alpha * (x + other)
# 张量布局与 add.yaml 同构（仅公式根算子由 Add 换为 Mul）；**配置-only 新增，零代码改动**。
# 2026-09-26（步②）：test_data 按 §C.4-2 改安全域 x,other∈[1,2]——预检遗留域
# [-10,10]/[-5,15] 与亚正规带相交，静态道保守拒绝；旧域取值留档（step② 归档）。
# 2026-09-30（步⑤接入）：补 §B.1 准入标记 experimental_unroll + §F.5 必填 length
#（各张量 offset=0 独占其 bank → 取满 bank_depth=256，与 add.yaml 同构）。
formula: "alpha * (x + other)"
experimental_unroll: true
tensors:
  x: { bank: 0, role: "input", offset: 0, length: 256 }
  other: { bank: 1, role: "input", offset: 0, length: 256 }
  alpha: { bank: 3, role: "param", offset: 0, length: 256 } # 标量系数（stride=0 驻留，消耗 1 word）
  constants: { bank: 7, role: "constant", offset: 0, length: 256 }
  y: { bank: 2, role: "output", offset: 0, length: 256 }
test_data:
  x: { range: [1.0, 2.0] }   # §C.4-2 安全域（静态区间 ⊥ 亚正规带且 ⊥ ±FLT_MAX）
  other: { range: [1.0, 2.0] }
  alpha: [2.5]
