version: '2.4'
description: AIACC SMC v2.4 Authoritative Hardware Specification (Standardized)
system_core:
  system_info:
    version: v1.2.1
    description: "SMC System Master Spec - \u5BF9\u9F50\u4EFF\u771F\u5668\u4E0E\u751F\
      \u6210\u5668\u6E90\u7801\u9A71\u52A8 (v0.3.11)"
    last_update: '2026-02-10'
    status: Golden Version - Final Alignment
  global_constants:
    UR_BANK_COUNT: 8
    UR_BANK_DEPTH: 256
    UR_LINE_WIDTH: 128
    IQ_HEADER_WIDTH: 41
    MAX_RTOVR_PORTS: 64
    __comment_timing__: System Level Timing Constraints (Cycles)
    UR_READ_LATENCY: 1
    UR_WRITE_LATENCY: 1
    RTOVR_LATENCY: 1
    REGISTER_DELAY: 0
    IQ_FETCH_LATENCY: 1
    PULSE_BEHAVIOR: true
  resource_constraints:
    read_ports_per_bank: 1
    write_ports_per_bank: 1
    total_read_ports: 4
    total_write_ports: 4
    max_parallel_iq: 999
    bus_width: 128
    unit_instances:
      FPMUL: 1
      FPADD: 1
      INTADD: 1
      LOGIC: 1
      FPTOFP: 1
      FPTOINT: 1
      INTTOFP: 1
      INTTOINT: 1
      INT8TOFP16: 1
      FP16MUL: 1
      FP32ADDTREE5TO1: 1
      FP32ADDTREE8TO1: 1
      SHIFTUP: 1
      SHIFTDN: 1
      RTOVR: 64
    # ADR-018 v7 D1: 显式 per-SMC schema（值同 unit_instances，语义为每 SMC 一套）
    unit_instances_per_smc:
      FPMUL: 1
      FPADD: 1
      INTADD: 1
      LOGIC: 1
      FPTOFP: 1
      FPTOINT: 1
      INTTOFP: 1
      INTTOINT: 1
      INT8TOFP16: 1
      FP16MUL: 1
      FP32ADDTREE5TO1: 1
      FP32ADDTREE8TO1: 1
      SHIFTUP: 1
      SHIFTDN: 1
      RTOVR: 64
    smc_shared_units: []
  iq_registry:
    UR_READ: 30
    UR_WRITE: 35
    RTOVR: 100
    INTADD: 0
    FPMUL: 3
    FPADD: 4
    FPTOFP: 6
    FPTOINT: 8
    INTTOFP: 9
    INTTOINT: 7
    LOGIC: 10
    INT8TOFP16: 14
    FP16MUL: 18
    FP32ADDTREE5TO1: 26
    FP32ADDTREE8TO1: 28
    SHIFTUP: 29
    SHIFTDN: 34
    STB: 7
  iq_header:
  - field: INC_EMBED
    width: 6
  - field: INC
    width: 4
  - field: DLY
    width: 3
  - field: COND
    width: 7
  - field: LOOPS
    width: 10
  - field: EMBED_END
    width: 6
  - field: EMBED_LOOPS
    width: 3
  - field: JUMP
    width: 1
  - field: VLD
    width: 1
functional_units:
  LOGIC:
    unit_name: LOGIC
    latency: 1
    attributes:
      throughput: 1
      desc: Logic Operations (AND, OR, XOR, etc.)
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      - name: ST
        width: 128
      outputs:
      - name: D
        width: 128
        type: data
        rtovr_src_id: 10
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: OP_TYPE
      width: 4
      default: 0
      encoding:
        0: AND
        1: OR
        2: XOR
        3: NOT
        4: COPY
        5: SELECT_GT
        6: SELECT_EQ
        7: SELECT_LS
        8: LSH_L
        9: ASH_L
        10: ROT_L
        11: LSH_R
        12: ASH_R
        13: ROT_R
        14: CLZ
        15: CTZ
    - field: PRECISION
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        PREC_16:
          element_type: UINT
          count: 8
          width: 16
        PREC_32:
          element_type: UINT
          count: 4
          width: 32
      execution_modes:
      - name: LOGIC_CORE
        condition: VALID == 'VALID'
        input_sources:
        - S0
        - S1
        layout_ref: PRECISION
        operation_map:
          AND: bitwise_and
          OR: bitwise_or
          XOR: bitwise_xor
          SELECT_GT: select_by_st_gt
          LSH_R: logical_shift_right
          ASH_R: arithmetic_shift_right
          CLZ: count_leading_zeros
  FPMUL:
    unit_name: FPMUL
    latency: 4
    attributes:
      throughput: 1
      desc: Floating Point Multiplier
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      outputs:
      - name: D
        width: 128
        type: data
        rtovr_src_id: 3
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: SRC_PREC
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: DST_PREC
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        PREC_16:
          element_type: FP16
          count: 8
          width: 16
        PREC_32:
          element_type: FP32
          count: 4
          width: 32
      execution_modes:
      - name: FPMUL_CORE
        condition: VALID == 'VALID'
        input_source:
        - S0
        - S1
        layout_ref: SRC_PREC
        operation:
          type: ARITHMETIC
          primitive: fp_mul_hw
  INT8TOFP16:
    unit_name: INT8TOFP16
    latency: 2
    attributes:
      throughput: 1
      desc: Int8 to FP16 converter (32xInt8 -> 32xFP16 scattered)
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      outputs:
      - name: D0
        width: 128
        type: data
        rtovr_src_id: 14
      - name: D1
        width: 128
        type: data
        rtovr_src_id: 15
      - name: D2
        width: 128
        type: data
        rtovr_src_id: 16
      - name: D3
        width: 128
        type: data
        rtovr_src_id: 17
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: SRC_SIGN
      width: 1
      default: 1
      encoding:
        0: UNSIGNED
        1: SIGNED
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        INT8_PACK:
          element_type: INT
          count: 16
          width: 8
        FP16_PACK:
          element_type: FP16
          count: 8
          width: 16
      execution_modes:
      - name: I8TOF16_CORE
        condition: VALID == 'VALID'
        input_source:
        - S0
        - S1
        operation:
          type: CONVERT
          src_type: INT8
          dst_type: FP16
          logic: 32xInt8 -> 32xFP16 scattered across D0-D3
  FP32ADDTREE8TO1:
    unit_name: FP32ADDTREE8TO1
    latency: 3
    attributes:
      throughput: 1
      desc: 8-to-1 Reduction FP32 Add Tree (16-bit to 32-bit)
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      outputs:
      - name: D
        width: 128
        type: data
        rtovr_src_id: 28
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: DST_REG
      width: 2
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
  INTADD:
    unit_name: INTADD
    latency: 1
    attributes:
      throughput: 1
      desc: Integer Adder (32-bit/4-bit Mixed)
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      - name: S2
        width: 128
      outputs:
      - name: D0
        width: 128
        type: data
        rtovr_src_id: 0
      - name: D1
        width: 128
        type: data
        rtovr_src_id: 1
      - name: ST
        width: 128
        type: status
        rtovr_src_id: 2
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: SRC0_PREC
      width: 2
      default: 3
      encoding:
        0: INT4
        1: INT8
        2: INT16
        3: INT32
    - field: SRC1_PREC
      width: 2
      default: 3
      encoding:
        0: INT4
        1: INT8
        2: INT16
        3: INT32
    - field: SRC2_PREC
      width: 2
      default: 3
      encoding:
        0: INT4
        1: INT8
        2: INT16
        3: INT32
    - field: SRC0_SIGN
      width: 1
    - field: SRC1_SIGN
      width: 1
    - field: SRC2_SIGN
      width: 1
    - field: DST_SIGN
      width: 1
      default: 1
      encoding:
        0: UNSIGNED
        1: SIGNED
    - field: UPDATE_ST
      width: 1
      default: 1
      encoding:
        0: 'NO'
        1: 'YES'
    - field: ADD_SUB
      width: 1
      default: 0
      encoding:
        0: ADD
        1: SUB
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        INT4:
          element_type: INT
          count: 32
          width: 4
        INT8:
          element_type: INT
          count: 16
          width: 8
        INT16:
          element_type: INT
          count: 8
          width: 16
        INT32:
          element_type: INT
          count: 4
          width: 32
      execution_modes:
      - name: MODE_4BIT_CONCAT
        condition: SRC0_PREC == 'INT4'
        layout: INT4
        inputs:
          A:
            sources:
            - S0
            - S1
            transformation: CONCAT_4_TO_8
          B:
            source: S2
            transformation: NONE
        operation:
          type: ARITHMETIC
          formula: B - A if ADD_SUB == 'SUB' else B + A
          saturation:
            width: 8
            signed_ref: DST_SIGN
        outputs:
          D0:
            source: result
            slice:
            - 0
            - 4
          D1:
            source: result
            slice:
            - 4
            - 4
      - name: MODE_32BIT_STANDARD
        condition: SRC0_PREC == 'INT32'
        layout: INT32
        inputs:
          A:
            source: S0
          B:
            source: S1
        operation:
          type: ARITHMETIC
          formula: A - B if ADD_SUB == 'SUB' else A + B
          saturation:
            width: 32
            signed_ref: DST_SIGN
        side_effects:
          ST:
            type: COMPARISON
            condition: UPDATE_ST == 'YES'
  SHIFTUP:
    unit_name: SHIFTUP
    latency: 1
    code_bits: 135  # 严格按硬件 spec 表 544（vld+data+broadcast+smc_id_en）
    attributes:
      throughput: 1
      desc: Cross-SMC chain shift (upward), supports broadcast and point-to-point modes
      cross_smc_chain: true
      cross_smc_data_source: SMC_0
      chain_direction: ascending
    ports:
      inputs:
      - name: CRU_SHIFTUP_I
        width: 135  # 硬件 spec 表 542：寄存器宽度 = 整个 microinstruction
        cross_smc_src: true
      - name: SMC_ID
        width: 5
        desc: "本模块所在 SMC ID 编码（硬件接口；emitter 无需注入）"
      outputs:
      - name: CRU_SHIFTUP_O
        width: 135
        cross_smc_dst: true
      - name: DR_SHIFTUP_D
        width: 128
        type: data
        rtovr_src_id: 29
    micro_instructions:
    # 严格按硬件 spec 表 544，仅 4 个字段（OQ-4 答案被新 spec supersede，ADR-019 errata task #19）
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: data
      width: 128
      default: 0
    - field: broadcast
      width: 1
      default: 0
      encoding:
        0: P2P
        1: BROADCAST
    - field: smc_id_en
      width: 5
  INTTOFP:
    unit_name: INTTOFP
    latency: 1
    attributes:
      throughput: 1
      desc: Generated spec for INTTOFP
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      outputs:
      - name: D
        width: 128
        type: data
        rtovr_src_id: 9
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: SRC_PREC
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: DST_PREC
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: SRC_SIGN
      width: 1
      default: 1
      encoding:
        0: UNSIGNED
        1: SIGNED
    - field: SRC_POS
      width: 1
      default: 0
      encoding:
        0: LOW
        1: HIGH
    - field: DST_POS
      width: 1
      default: 0
      encoding:
        0: LOW
        1: HIGH
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        PREC_16:
          element_type: INT
          count: 8
          width: 16
        PREC_32:
          element_type: INT
          count: 4
          width: 32
      execution_modes:
      - name: ITOF_GENERIC
        condition: VALID == 'VALID'
        input_source: S0
        operation:
          type: CONVERT
          src_type: INT
          dst_type: FLOAT
          src_sign: SRC_SIGN
          src_layout: get_layout(SRC_PREC)
          dst_layout: get_layout(DST_PREC)
  FP32ADDTREE5TO1:
    unit_name: FP32ADDTREE5TO1
    latency: 4
    attributes:
      throughput: 1
      desc: Cumulative 32-to-8 FP32 Add Tree
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      - name: S2
        width: 128
      - name: S3
        width: 128
      - name: S4
        width: 128
      - name: S5
        width: 128
      - name: S6
        width: 128
      - name: S7
        width: 128
      outputs:
      - name: D0
        width: 128
        type: data
        rtovr_src_id: 26
      - name: D1
        width: 128
        type: data
        rtovr_src_id: 27
    micro_instructions:
    # RTL 表 517（user 2026-06-02）：vld → accumulate → smc_id_en（共 7 bit）。
    # 原 master 仅 VALID（漏 accumulate + smc_id_en）→ body 与真 RTL 错位（VCS 解码假 JUMP）
    # + cumulative 未编码进固件。见 ADR-029。本 spec 是 HardwareSpec.load 的权威源
    # （覆盖 modules.yaml.code_fields 与 specs/units/*.yaml），故修必落此处。
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: accumulate
      width: 1
      default: 0
      encoding:
        0: NO_ACCUM      # old_i 不参与，本拍 reduce 独立
        1: ACCUM         # old_i 参与累加（cumulative）
    - field: smc_id_en
      width: 5
      default: 0
      # ⚠ DEBT-029-SMCEN：addtree smc_id_en 当前 emit=0（master 原本就没此字段，恒 0 pad）。
      # 表 517 语义：smc_id_en >= SMC_ID 才使能 → =0 仅 SMC_0。多-SMC addtree 在 VCS 上
      # 是否需 emit PARAM_SMC_NUM-1（使能全 SMC）待裁定，与本次 accumulate 修复正交。
    behavioral_semantics:
      data_layouts:
        ACC_CHANNEL:
          element_type: FP32
          count: 8
          width: 32
        INPUT_SRC_PLANE:
          element_type: NIBBLE
          count: 32
          width: 4
      execution_modes:
      - name: TREE_ACCUMULATE_5TO1
        condition: VALID == 'VALID'
        input_source:
        - S0
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
        - S7
        latching: true
        operation:
          type: REDUCTION
          primitive: fp32_add_hw
          cumulative: true
          reduction_per_channel: 4
  FP16MUL:
    unit_name: FP16MUL
    latency: 4
    attributes:
      throughput: 1
      desc: 8xFP16 Multiplier
    ports:
      inputs:
      - name: S0
        width: 128
      - name: S1
        width: 128
      outputs:
      - name: D0
        width: 128
        type: data
        rtovr_src_id: 18
      - name: D1
        width: 128
        type: data
        rtovr_src_id: 19
      - name: D2
        width: 128
        type: data
        rtovr_src_id: 20
      - name: D3
        width: 128
        type: data
        rtovr_src_id: 21
      - name: D4
        width: 128
        type: data
        rtovr_src_id: 22
      - name: D5
        width: 128
        type: data
        rtovr_src_id: 23
      - name: D6
        width: 128
        type: data
        rtovr_src_id: 24
      - name: D7
        width: 128
        type: data
        rtovr_src_id: 25
    # ADR-032：改正——原为 FPMUL copy-paste（SRC_PREC/DST_PREC，FP16MUL 无此字段，v0.4.19:185 自点 Typo）。
    # 真 compute 微指令（表512 CRU_FP16MUL）= vld+src_0_id(1)+src_1_id(1)+smc_id_en(5)=8bit。
    # 此处仅 compute 组（loader override 顶层 code_fields）；load_s0123/load_s4567 三组在 modules.yaml micro_groups。
    micro_instructions:
    - field: vld
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: src_0_id
      width: 1
      default: 0
    - field: src_1_id
      width: 1
      default: 0
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        FP16:
          element_type: FP16
          count: 8
          width: 16
      execution_modes:
      - name: FP16MUL_CORE
        condition: vld == 'VALID'
        input_source:
        - S0
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
        - S7
        layout: FP16
        operation:
          type: ARITHMETIC
          primitive: fp_mul_hw
  SHIFTDN:
    unit_name: SHIFTDN
    latency: 1
    code_bits: 7  # ADR-031 / v0.4.19 表 547：vld(1)+broadcast(1)+smc_id_en(5)
    attributes:
      throughput: 1
      desc: Cross-SMC chain shift (downward), no broadcast field (spec 表 547)
      cross_smc_chain: true
      cross_smc_data_source: dynamic
      chain_direction: descending
    ports:
      inputs:
      - name: CRD_SHIFTDN_I   # 硬件 spec 表 545：CRD（下行寄存器）不是 CRU
        width: 129
        cross_smc_src: true
      - name: DVR_SHIFTDN_S
        width: 128
      - name: SMC_ID
        width: 5
        desc: "本模块所在 SMC ID 编码（硬件接口）"
      outputs:
      - name: CRD_SHIFTDN_O
        width: 129
        cross_smc_dst: true
    micro_instructions:
    # ADR-031 / v0.4.19 表 547：vld + broadcast + smc_id_en = 7bit（data 走源寄存器 DVR_SHIFTDN_S，非立即数；原 spec 误把 data 当指令立即数）。
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: broadcast
      width: 1
      default: 0
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      smc_id_en_source: "spec gap — 功能公式用 smc_id_en 但 spec 表 545/547 均未列；sim fallback PARAM_SMC_NUM-1"
  UR_WRITE:
    unit_name: UR_WRITE
    latency: 1
    attributes:
      throughput: 1
      desc: User Register Write Port
    ports:
      inputs:
      - name: DATA
        width: 128
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: BANK
      width: 3
      default: 0
    - field: ADDR
      width: 8
      default: 0
    - field: wbe
      width: 16
      default: 65535
    - field: smc_id_en
      width: 5
      default: 0
  RTOVR:
    unit_name: RTOVR
    latency: 1
    attributes:
      throughput: 1
      desc: Register to Vector Register Routing
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: SEL
      width: 6
      default: 0
  FPTOFP:
    unit_name: FPTOFP
    latency: 1
    attributes:
      throughput: 1
      desc: Generated spec for FPTOFP
    ports:
      inputs:
      - name: S
        width: 128
      outputs:
      - name: D
        width: 128
        type: data
        rtovr_src_id: 6
    micro_instructions:
    - field: VALID
      width: 1
      default: 0
      encoding:
        0: INVALID
        1: VALID
    - field: SRC_PREC
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: DST_PREC
      width: 1
      default: 1
      encoding:
        0: PREC_16
        1: PREC_32
    - field: SRC_POS
      width: 1
      default: 0
      encoding:
        0: LOW
        1: HIGH
    - field: DST_POS
      width: 1
      default: 0
      encoding:
        0: LOW
        1: HIGH
    - field: smc_id_en
      width: 5
      default: 0
    behavioral_semantics:
      latching: pre_load_on_valid_or_nonzero
      data_layouts:
        PREC_16:
          element_type: FP16
