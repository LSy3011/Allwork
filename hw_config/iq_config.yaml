iq_config:
  IQ_FPADD:
    module: FPADD
    EN_LOOPS: true
    BITS_LOOPS: 10
    EN_DLY: true
    BITS_DLY: 3
    BITS_CODE: 10 # VALID(1) + SUB(1) + SRC0_PREC(1) + DST_PREC(1) + UPDATE_ST(1) + ...

  IQ_FPMUL:
    module: FPMUL
    EN_LOOPS: true
    BITS_LOOPS: 10
    EN_DLY: true
    BITS_DLY: 3
    BITS_CODE: 8

  IQ_LOGIC:
    module: LOGIC
    EN_LOOPS: true
    BITS_LOOPS: 10
    EN_DLY: true
    BITS_DLY: 3
    BITS_CODE: 11 # VALID(1) + OP_TYPE(4) + PRECISION(1) + SMC_ID(5)

  IQ_UR_READ:
    module: UR_READ
    count: 4
    EN_LOOPS: true
    EN_INC: true
    BITS_LOOPS: 10
    BITS_CODE: 17

  IQ_UR_WRITE:
    module: UR_WRITE
    count: 4
    EN_LOOPS: true
    EN_INC: true
    BITS_LOOPS: 10
    BITS_CODE: 33

  IQ_RTOVR:
    module: RTOVR
    count: 64
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 7

  IQ_INTADD:
    module: INTADD
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 18

  IQ_FPTOINT:
    module: FPTOINT
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 10

  IQ_INTTOFP:
    module: INTTOFP
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 11 # 修正对齐 inttofp.yaml (1+1+1+1+1+1+5=11)

  IQ_INTTOINT:
    module: INTTOINT
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 12

  IQ_FPTOFP:
    module: FPTOFP
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 10

  IQ_INT8toFP16:
    module: INT8toFP16
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 7

  IQ_SHIFTUP:
    module: SHIFTUP
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 135 # vld(1) + data(128) + broadcast(1) + smc_id_en(5) — 严格按硬件 spec 表 544 (ADR-019 errata task #19)

  IQ_SHIFTDN:
    module: SHIFTDN
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 129 # vld(1) + data(128) — 严格按硬件 spec 表 547

  # ADR-034: SMI_DS_T 跨-SMC 转置单元的驱动 IQ（base id 40，system_core.yaml）
  IQ_SMI_DS_T:
    module: SMI_DS_T
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 5 # 表598: vld+intlv_en+intlv_grp+intlv_in+intlv_out 各 1bit（Stage-I 单指令 payload；CRI 框架宽 gated NEEDS-USER-FACT-034-CRI）

  # ADR-053: VIN/VOUT 绕行寄存器（逻辑 id 54/55/56 → TB 归 RTL 槽 68/69/70）。
  #   BITS_CODE=7：CODE[5:0] = vld(1) + smc_id_en(5)、CODE[6] 为保留位（恒 0）
  #   —— smi_iq_cru_widths.vh:16「IQ68..70 use CODE[5:0] for VIN..CODE[6] is reserved」；
  #   曾为 6，致 header 落在 [46:6]、RTL 读 bit47 VLD=0，VCS 实测 bank2 全零（2026-09-12 errata）。
  #   ⚠ 文档性条目：emit 帧宽实际由 packer.py 读 modules.yaml code_bits（STB/LDB 同此先例，
  #   均无 iq_config 条目）；此处登记为四向同步守卫② 的一环 + 防未来严格消费。
  IQ_VIN0:
    module: VIN0
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 7

  IQ_VIN1:
    module: VIN1
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 7

  IQ_VOUT0:
    module: VOUT0
    EN_LOOPS: true
    BITS_LOOPS: 10
    BITS_CODE: 7
