unit_name: SHIFTDN
latency: 1
code_bits: 7  # ADR-031 / v0.4.19 表 547：vld(1)+broadcast(1)+smc_id_en(5)；data 走源寄存器 DVR_SHIFTDN_S 非立即数
attributes:
  throughput: 1
  desc: Cross-SMC chain shift (downward), no broadcast field (OQ-5 + spec 表 547)
  cross_smc_chain: true
  cross_smc_data_source: dynamic
  chain_direction: descending
ports:
  inputs:
    - name: CRD_SHIFTDN_I   # 硬件 spec 表 545：CRD 不是 CRU（下行寄存器）
      width: 129            # 寄存器宽度 = 整个 microinstruction
      cross_smc_src: true
    - name: DVR_SHIFTDN_S
      width: 128
    - name: SMC_ID
      width: 5
      desc: "本模块所在 SMC 的 ID 编码（硬件接口，emitter 无需注入）"
  outputs:
    - name: CRD_SHIFTDN_O
      width: 129
      cross_smc_dst: true
micro_instructions:
  # ADR-031 / v0.4.19 表 547：vld + broadcast + smc_id_en = 7bit。
  # data 走源寄存器 DVR_SHIFTDN_S（非指令立即数）——原 spec 误把 data(128) 当指令字段。
  # smc_id_en 双义（表 547 注「与一般计算模块有差别」）：广播时=阈值门控 smc_id_en>=SMC_ID 使能；
  # 不广播时=要读取的目的 UR 的 SMC ID（端点寻址）。
  - field: VALID
    width: 1
    default: 0
    encoding:
      0: INVALID
      1: VALID
  - field: broadcast
    width: 1
    default: 0
  - field: smc_id_en
    width: 5
    default: 0
behavioral_semantics:
  start_point: "SMC_ID == smc_id_en: CRD_SHIFTDN_O <- DVR_SHIFTDN_S"
  chain_propagation: "SMC_ID < smc_id_en: CRD_SHIFTDN_O <- CRD_SHIFTDN_I"
  chain_stage_latency: 1
  smc_id_en_source: "ADR-031 / v0.4.19 表 547 已列 smc_id_en（含于微指令，非 spec gap）；emit 缺省 PARAM_SMC_NUM-1"
  iq_slot_consumption: "SMC_ID <= smc_id_en 沿途每 SMC 在 t=t0（同步发射，OQ-8 (i)）各消耗自己的 SHIFTDN IQ slot"
