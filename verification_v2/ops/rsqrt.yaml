name: "rsqrt"
# 对应 torch.rsqrt(x) (即 1/sqrt(x)) 在 x=1.0 附近的 4 阶展开 Horner 多项式：
# y = 0.2734375*x**4 - 1.40625*x**3 + 2.953125*x**2 - 3.28125*x + 2.4609375
# 采用纯一维线性 Horner 展开，100% 消除分支合并与单 Bank 1 读端口时序碰撞！
formula: "2.4609375 + x * (-3.28125 + x * (2.953125 + x * (-1.40625 + 0.2734375 * x)))"
tensors:
  x: { bank: 0, role: "input", offset: 0 }
  constants: { bank: 7, role: "constant", offset: 0 }
  y: { bank: 2, role: "output", offset: 0 }
test_data:
  x: { range: [0.6, 1.4] }
