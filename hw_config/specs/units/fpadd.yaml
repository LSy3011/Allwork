unit_name: FPADD
latency: 4
attributes:
  throughput: 1
  desc: Floating Point Adder
ports:
  inputs:
  - name: S0
    width: 128
  - name: S1
    width: 128
  outputs:
  - name: D
    width: 128
    type: data
    rtovr_src_id: 4       # RtoVRInputSource.DR_FPADD_D
  - name: ST
    width: 128
    type: status
    rtovr_src_id: 5       # RtoVRInputSource.DR_FPADD_ST
micro_instructions:
- field: VALID
  width: 1
  default: 0
  encoding:
    0: INVALID
    1: VALID
- field: SRC_PREC
  width: 1
  default: 1
  encoding:
    0: PREC_16
    1: PREC_32
- field: DST_PREC
  width: 1
  default: 1
  encoding:
    0: PREC_16
    1: PREC_32
- field: UPDATE_ST
  width: 1
  default: 1
  encoding:
    0: 'NO'
    1: 'YES'
- field: SUB
  width: 1
  default: 0
  encoding:
    0: ADD
    1: SUB
- field: SMC_ID
  width: 5
  default: 0
behavioral_semantics:
  latching: pre_load_on_valid_or_nonzero # 支持“数据先到、指令后发”模式
  data_layouts:
    PREC_16: { element_type: FP16, count: 8, width: 16 }
    PREC_32: { element_type: FP32, count: 4, width: 32 }
  
  execution_modes:
    - name: FPADD_CORE
      condition: "VALID == 'VALID'"
      input_source: [S0, S1]
      layout_ref: "SRC_PREC"
      operation:
        type: ARITHMETIC
        # 引用 fp_add_hw
        primitive: fp_add_hw
        status_update: { field: ST, condition: "UPDATE_ST == 'YES'" }
