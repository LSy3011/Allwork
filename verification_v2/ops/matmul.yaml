name: "matmul"
formula: "Matrix([
  a0*b0_0 + a1*b1_0 + a2*b2_0 + a3*b3_0,
  a0*b0_1 + a1*b1_1 + a2*b2_1 + a3*b3_1,
  a0*b0_2 + a1*b1_2 + a2*b2_2 + a3*b3_2,
  a0*b0_3 + a1*b1_3 + a2*b2_3 + a3*b3_3,
  a0*b0_4 + a1*b1_4 + a2*b2_4 + a3*b3_4,
  a0*b0_5 + a1*b1_5 + a2*b2_5 + a3*b3_5,
  a0*b0_6 + a1*b1_6 + a2*b2_6 + a3*b3_6,
  a0*b0_7 + a1*b1_7 + a2*b2_7 + a3*b3_7
])"
tensors:
  # Vector A (stored on Bank 0)
  a0: { bank: 0, offset: 0, role: "input", precision: "fp32", stride: 4 }
  a1: { bank: 0, offset: 1, role: "input", precision: "fp32", stride: 4 }
  a2: { bank: 0, offset: 2, role: "input", precision: "fp32", stride: 4 }
