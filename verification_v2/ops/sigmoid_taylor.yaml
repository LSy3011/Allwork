name: "sigmoid_taylor"
# Horner form of Sigmoid Taylor: 0.5 + x * (0.25 + x * (0.0 - 0.0208333 * x))
formula: "0.5 + x * (0.25 + x * (0.0 - 0.0208333 * x))"
tensors:
  x: { bank: 0, role: "input", offset: 0 }
  constants: { bank: 7, role: "constant", offset: 0 }
  y: { bank: 2, role: "output", offset: 0 }
test_data:
  x: { range: [-2.0, 2.0] }
