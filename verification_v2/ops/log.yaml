name: "log"
# 对应 torch.log(x) 在 x=1.0 附近的 4 阶展开 Horner 多项式：
# y = -0.25*x**4 + 1.33333333*x**3 - 3.0*x**2 + 4.0*x - 2.08333333
# 采用纯一维线性 Horner 展开，100% 消除分支合并与单 Bank 1 读端口时序碰撞！
formula: "-2.08333333 + x * (4.0 + x * (-3.0 + x * (1.33333333 - 0.25 * x)))"
tensors:
  x: { bank: 0, role: "input", offset: 0 }
  constants: { bank: 7, role: "constant", offset: 0 }
  y: { bank: 2, role: "output", offset: 0 }
test_data:
  x: { range: [0.6, 1.4] }
